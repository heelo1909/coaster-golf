<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Coaster Golf</title>
    <style>
      /* Colour tokens are set from render/theme.ts by applyTheme() (ui/ThemePicker.ts); these
         defaults are Graphite, the default theme. data-style is "minimal" or "blueprint". */
      :root {
        --paper: #0f1115;
        --panel: #181b21;
        --line: rgba(217, 222, 229, 0.14);
        --label: #8b93a1;
        --ink: #d9dee5;
        --mark: #d7ff3a;
        --on-mark: #0f1115;
        --error: #ff8a7a;
        --ui: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
        --mono: 'JetBrains Mono', 'Cascadia Mono', Consolas, 'Courier New', monospace;
        --radius: 10px;
      }
      :root[data-style='blueprint'] {
        --radius: 2px;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--paper);
        color: var(--ink);
        font-family: var(--ui);
        -webkit-font-smoothing: antialiased;
      }
      #app {
        display: flex;
        flex-direction: column;
        height: 100%;
        height: 100dvh;
      }
      .play-canvas {
        display: block;
        flex: 1;
        min-height: 0;
        width: 100%;
        touch-action: none; /* pinch and drag move the track, not the page */
        cursor: grab;
      }
      .play-canvas:active {
        cursor: grabbing;
      }
      /* Minimal themes: a solid accent Ride button, sentence case. */
      :root[data-style='minimal'] .ride-btn {
        border-color: var(--mark);
        background: var(--mark);
        color: var(--on-mark);
        letter-spacing: 0;
        text-transform: none;
      }
      :root[data-style='minimal'] .ride-btn:hover,
      :root[data-style='minimal'] .ride-btn:focus-visible {
        filter: brightness(1.08);
        box-shadow:
          0 0 0 2px var(--paper),
          0 0 0 4px var(--mark);
      }
      :root[data-style='minimal'] .eq-input,
      :root[data-style='minimal'] .result-btn {
        border-width: 1px;
        border-color: var(--line);
      }
      /* Keep the accent to 10%: the panel's frame and win title stay neutral, the star and
         Ride carry the accent. */
      :root[data-style='minimal'] .result:not(:empty) {
        border-width: 1px;
        border-color: var(--line);
      }
      :root[data-style='minimal'] .result[data-kind='won'] .result-title {
        color: var(--ink);
      }
      .theme-picker {
        position: fixed;
        top: 8px;
        right: 8px;
        z-index: 1;
      }
      .theme-toggle {
        display: grid;
        place-items: center;
        width: 44px;
        height: 44px;
        padding: 0;
        border: 0;
        border-radius: 50%;
        background: transparent;
        cursor: pointer;
        touch-action: manipulation;
      }
      .theme-dot {
        width: 16px;
        height: 16px;
        border-radius: 50%;
        border: 1.5px solid var(--label);
        background: linear-gradient(90deg, var(--paper) 50%, var(--ink) 50%);
        opacity: 0.7;
      }
      .theme-toggle:hover .theme-dot,
      .theme-toggle:focus-visible .theme-dot,
      .theme-toggle[aria-expanded='true'] .theme-dot {
        opacity: 1;
        border-color: var(--mark);
      }
      .theme-toggle:focus-visible {
        outline: 2px solid var(--mark);
        outline-offset: -4px;
      }
      .theme-menu {
        position: absolute;
        top: 46px;
        right: 4px;
        display: grid;
        gap: 2px;
        min-width: 168px;
        padding: 6px;
        border: 1px solid var(--line);
        border-radius: var(--radius);
        background: var(--panel);
      }
      .theme-menu[hidden] {
        display: none;
      }
      .theme-option {
        display: flex;
        align-items: center;
        gap: 10px;
        min-height: 44px;
        padding: 0 10px;
        border: 0;
        border-radius: calc(var(--radius) - 4px);
        background: transparent;
        color: var(--ink);
        font: 14px var(--ui);
        text-align: left;
        cursor: pointer;
      }
      .theme-option:hover,
      .theme-option:focus-visible {
        background: var(--line);
        outline: none;
      }
      .theme-option[aria-pressed='true'] {
        color: var(--mark);
      }
      .theme-swatch {
        width: 28px;
        height: 14px;
        border-radius: 4px;
        box-shadow: inset 0 0 0 1px var(--line);
      }
      .play-panel {
        background: var(--panel);
        border-top: 1px solid var(--line);
        /* At most 640px of controls, centred, on wide screens. */
        padding: 12px max(16px, calc((100% - 640px) / 2)) 16px;
      }
      .eq-row {
        display: flex;
        align-items: center;
        gap: 12px;
      }
      .eq-input {
        flex: 1;
        min-width: 0;
        min-height: 44px;
        box-sizing: border-box;
        padding: 0 12px;
        border: 1.5px solid var(--label);
        border-radius: var(--radius);
        background: var(--paper);
        color: var(--ink);
        font: 16px var(--mono);
      }
      .eq-input::placeholder {
        color: var(--label);
        opacity: 0.6;
      }
      .eq-input:focus {
        outline: 2px solid var(--mark);
        outline-offset: 1px;
      }
      .eq-input[aria-invalid] {
        border-color: var(--error);
      }
      .eq-counter {
        color: var(--label);
        font-size: 13px;
        white-space: nowrap;
      }
      .eq-counter.under-par {
        color: var(--mark);
      }
      /* Quick keys, on touch screens only: eight 44px keys fit a 375px phone in one row. */
      .eq-keys {
        display: none;
        gap: 1px;
        margin: 8px -8px 0;
      }
      @media (pointer: coarse) {
        .eq-keys {
          display: flex;
        }
      }
      .eq-key {
        flex: 1;
        min-width: 44px;
        min-height: 44px;
        padding: 0;
        border: 0;
        border-radius: calc(var(--radius) - 4px);
        background: var(--line);
        color: var(--ink);
        font: 16px var(--mono);
        touch-action: manipulation;
        cursor: pointer;
      }
      .eq-key:active {
        background: var(--mark);
        color: var(--on-mark);
      }
      .eq-math {
        color: var(--ink);
        font-size: 18px;
        overflow-x: auto;
        overflow-y: hidden;
      }
      .eq-math:not(:empty) {
        margin-top: 8px;
        padding: 2px 0;
      }
      .eq-math.faded {
        opacity: 0.4;
      }
      .eq-error {
        color: var(--error);
        font-size: 13px;
        overflow-wrap: anywhere;
      }
      .eq-error:not(:empty) {
        margin-top: 8px;
      }
      .eq-error code {
        display: block;
        margin-top: 4px;
        color: var(--ink);
        font: inherit;
        white-space: pre-wrap;
      }
      .eq-error u {
        text-decoration: underline var(--error) 2px;
        text-underline-offset: 4px;
      }
      .ride-btn {
        display: block;
        width: 100%;
        min-height: 44px;
        margin-top: 12px;
        border: 1.5px solid var(--mark);
        border-radius: var(--radius);
        background: transparent;
        color: var(--mark);
        font: 600 16px var(--ui);
        letter-spacing: 0.08em;
        text-transform: uppercase;
        cursor: pointer;
        touch-action: manipulation;
      }
      .ride-btn:hover,
      .ride-btn:focus-visible {
        background: var(--mark);
        color: var(--paper);
        outline: none;
      }
      .play-canvas[data-riding] {
        cursor: pointer;
      }
      .result:not(:empty) {
        margin-bottom: 12px;
        padding: 10px 12px;
        border: 1.5px solid var(--label);
        border-radius: var(--radius);
      }
      .result[data-kind='won'] {
        border-color: var(--mark);
      }
      .result[data-kind='failed'] {
        border-color: var(--error);
      }
      .result-title {
        font-size: 15px;
        overflow-wrap: anywhere;
      }
      .result[data-kind='won'] .result-title,
      .result-star {
        color: var(--mark);
      }
      .result[data-kind='failed'] .result-title {
        color: var(--error);
      }
      .result-star,
      .result-hint {
        margin-top: 6px;
        font-size: 13px;
      }
      .result-hint {
        color: var(--label);
      }
      .result-actions {
        display: flex;
        gap: 8px;
        margin-top: 10px;
      }
      .result-btn {
        flex: 1;
        min-height: 44px;
        border: 1.5px solid var(--label);
        border-radius: var(--radius);
        background: transparent;
        color: var(--ink);
        font: 14px var(--ui);
        cursor: pointer;
        touch-action: manipulation;
      }
      .result-btn:hover,
      .result-btn:focus-visible {
        border-color: var(--mark);
        color: var(--mark);
        outline: none;
      }
      .eq-note {
        color: var(--mark);
        font-size: 13px;
      }
      .eq-note:not(:empty) {
        margin-top: 8px;
      }
    </style>
  </head>
  <body>
    <main id="app"></main>
    <script type="module" src="/src/game/main.ts"></script>
  </body>
</html>
