# The leaderboard API (see worker/CLAUDE.md). Local dev needs no Cloudflare account:
#   npm run worker:db     creates the local D1 tables (.wrangler/, git-ignored)
#   npm run worker:dev    serves the API on http://localhost:8787
name = "coaster-golf-api"
main = "src/index.ts"
compatibility_date = "2026-10-01"

[[d1_databases]]
binding = "DB"
database_name = "coaster-golf"
# Set when the real database is created at launch (Section 9); local dev ignores it.
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"

# The game's own origin, allowed by CORS besides localhost. Set at launch (Section 9).
[vars]
ALLOWED_ORIGIN = ""

# 30 submissions per minute per IP (worker/CLAUDE.md). IPs are only the limiter's key; they're
# never stored.
[[ratelimits]]
name = "SUBMIT_LIMIT"
namespace_id = "1001"
simple = { limit = 30, period = 60 }
