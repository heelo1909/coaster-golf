# The leaderboard API (see worker/CLAUDE.md). Local dev needs no Cloudflare account:
#   npm run worker:db     creates the local D1 tables (.wrangler/, git-ignored)
#   npm run worker:dev    serves the API on http://localhost:8787
name = "coaster-golf-api"
main = "src/index.ts"
compatibility_date = "2026-10-01"

[[d1_databases]]
binding = "DB"
database_name = "coaster-golf"
# The production database (created 2026-10-30, docs/launch/deploy.md); local dev ignores it.
database_id = "37aee9ea-1e0d-48d9-b7b2-b597e6622547"
migrations_dir = "migrations"

# The game's own origin, allowed by CORS besides localhost (the site Worker, wrangler.jsonc).
[vars]
ALLOWED_ORIGIN = "https://coaster-golf.coaster-golf.workers.dev"

# 30 submissions per minute per IP (worker/CLAUDE.md). IPs are only the limiter's key; they're
# never stored.
[[ratelimits]]
name = "SUBMIT_LIMIT"
namespace_id = "1001"
simple = { limit = 30, period = 60 }
