# Builds the game and publishes it to GitHub Pages at https://heelo1909.github.io/coaster-golf/
# on every push to main (docs/launch/deploy.md). Tests and the level check must pass first.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; a newer push replaces a queued one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run check-levels
      - name: Build for Pages
        run: npm run build
        env:
          # Pages serves the repo under /coaster-golf/; the shared leaderboard stays on Cloudflare.
          BASE_PATH: /coaster-golf/
          VITE_API_URL: https://coaster-golf-api.coaster-golf.workers.dev
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
